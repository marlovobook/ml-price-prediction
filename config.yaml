data:
  stock_symbols:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - META
  start_date: "2020-01-01"  # More recent data for better relevance
  end_date: "2025-12-15"    # Extended to recent date
  data_source: yahoo
  retry_attempts: 3
  retry_delay: 1.0

features:
  pattern_lengths:
    - 3
    - 5
    - 7
    - 14
  technical_indicators:
    - RSI
    - MACD
    - EMA20
    - EMA50
    - EMA200
    - ATR
    - SMA
  chart_patterns:
    - golden_cross
    - head_and_shoulder
    - wedge
  fibonacci_levels:
    - 0.236
    - 0.382
    - 0.5
    - 0.618
    - 0.786

models:
  model_types:
    - xgboost
    - random_forest
    - svm
    - neural_network
  train_test_split: 0.8
  validation_split: 0.2
  cross_validation_folds: 5
  random_state: 42
  xgboost_params:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
  random_forest_params:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 2
    min_samples_leaf: 1
  svm_params:
    C: 1.0
    kernel: rbf
    gamma: scale
  neural_network_params:
    hidden_layer_sizes:
      - 100
      - 50
    activation: relu
    solver: adam
    max_iter: 1000

backtest:
  initial_capital: 100000.0
  transaction_cost: 0.001
  slippage: 0.0005
  position_size: 1.0
  risk_free_rate: 0.02

system:
  log_level: INFO
  log_file: stock_predictor.log
  model_save_path: models
  data_cache_path: data_cache
  results_path: results
  max_workers: 4
  memory_limit_gb: 8.0