# Dashboard Configuration for Stock Direction Predictor
dashboard:
  title: "Stock Direction Predictor Dashboard"
  page_icon: "chart_with_upwards_trend"
  layout: "wide"
  
  # Default selections
  default_symbols: ["AAPL", "MSFT", "NVDA"]
  default_patterns: [3, 5, 7, 14]
  default_models: ["xgboost", "random_forest"]
  
  # Chart settings
  charts:
    theme: "plotly"
    color_palette: ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd"]
    height: 400
    
  # Real-time settings
  realtime:
    enabled: true
    refresh_intervals: ["5 minutes", "15 minutes", "30 minutes", "1 hour"]
    default_interval: "15 minutes"
    
  # Performance settings
  performance:
    cache_ttl: 3600  # 1 hour in seconds
    max_cache_size: 100  # Maximum number of cached results
    
# Display settings
display:
  metrics:
    decimal_places: 2
    percentage_format: ".1%"
    currency_format: "$,.0f"
    
  tables:
    page_size: 20
    sortable: true
    filterable: true
    
  charts:
    show_grid: true
    show_legend: true
    interactive: true

# Analysis settings
analysis:
  # Default date range (days from today)
  default_lookback_days: 730  # 2 years
  
  # Minimum data requirements
  min_data_points: 100
  
  # Risk metrics
  risk_free_rate: 0.02  # 2% annual risk-free rate
  
  # Backtesting settings
  initial_capital: 10000
  transaction_cost: 0.001  # 0.1%
  slippage: 0.0005  # 0.05%